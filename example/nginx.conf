# Do NOT add a `types { ... }` block here. `types` replaces the inherited table rather than
# extending it, which drops text/html and application/javascript and makes the browser refuse to
# execute the module script: the page renders blank and nothing explains why. The extra mappings
# (.ttf, .docx) are appended to /etc/nginx/mime.types in the Dockerfile instead.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /fonts/ {
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    # Without this the SPA fallback answers /.env with 200 and a copy of index.html, which reads as
    # a successful secret fetch to every scanner on the internet.
    location ~ /\. {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml font/ttf image/svg+xml;
    gzip_min_length 1024;
}
